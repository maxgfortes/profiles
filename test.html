<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Links</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body { background: #121212; color: #f8f9f9; font-family: Arial, sans-serif; padding: 20px; }
  h2 { margin-bottom: 20px; }
  .form-container { margin-bottom: 30px; }
  input, select { padding: 8px; margin: 5px 0; width: 100%; border-radius: 5px; border: none; }
  button { padding: 10px 20px; background: #4A90E2; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
  button:hover { background: #357ABD; }
  .links-container { display: flex; flex-direction: column; gap: 12px; }
  .link-box { display: flex; align-items: center; gap: 12px; padding: 12px; background: #1e1e1e; border-radius: 8px; text-decoration: none; color: #f8f9f9; transition: background 0.2s; }
  .link-box:hover { background: #333; }
  .link-icon { font-size: 24px; width: 30px; text-align: center; }
</style>
</head>
<body>

<h2>Cadastro de Links</h2>

<div class="links-editor">
  <select id="linkType">
    <option value="instagram">Instagram</option>
    <option value="twitter">Twitter</option>
    <option value="tiktok">TikTok</option>
    <option value="youtube">YouTube</option>
    <option value="github">GitHub</option>
    <option value="linkedin">LinkedIn</option>
    <option value="discord">Discord</option>
    <option value="spotify">Spotify</option>
    <option value="link">Outro</option>
  </select>
  <input type="text" id="linkTitle" placeholder="Título do link">
  <input type="url" id="linkUrl" placeholder="URL do link (https://...)">
  <button id="addLinkBtn">Adicionar Link</button>
</div>

<script type="module">
import { doc, getDoc, setDoc, arrayUnion, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { auth, db, currentUser } from "./path-to-your-profile-script.js"; // ajuste o caminho

const addLinkBtn = document.getElementById('addLinkBtn');
const linkTypeInput = document.getElementById('linkType');
const linkTitleInput = document.getElementById('linkTitle');
const linkUrlInput = document.getElementById('linkUrl');

// Pega o container dos links
const linksContainer = document.querySelector('.links-tab .about-container');

let userLinksDocRef = null;

// Espera o usuário logado
auth.onAuthStateChanged(user => {
  if (!user) return;
  userLinksDocRef = doc(db, `users/${user.uid}/user-infos/links`);
  carregarLinksRealtime();
});

async function carregarLinksRealtime() {
  if (!userLinksDocRef) return;

  onSnapshot(userLinksDocRef, (snapshot) => {
    const data = snapshot.exists() ? snapshot.data() : { links: [] };
    renderLinks(data.links || []);
  });
}

function renderLinks(links) {
  if (!links || links.length === 0) {
    linksContainer.innerHTML = `
      <div class="about-box" style="text-align: center; padding: 20px;">
        <div class="icon-area"><div class="icon-place"><i class="fas fa-link" style="font-size: 38px; color: #f8f9f9;"></i></div></div>
        <h3 style="color: #f8f9f9; margin-bottom: 12px;">Nenhum link cadastrado</h3>
        <p style="color: #aaa;">Adicione links para seu perfil aqui</p>
      </div>
    `;
    return;
  }

  const icones = {
    instagram: '<i class="fab fa-instagram"></i>',
    twitter: '<i class="fab fa-twitter"></i>',
    tiktok: '<i class="fab fa-tiktok"></i>',
    youtube: '<i class="fab fa-youtube"></i>',
    github: '<i class="fab fa-github"></i>',
    linkedin: '<i class="fab fa-linkedin"></i>',
    discord: '<i class="fab fa-discord"></i>',
    spotify: '<i class="fab fa-spotify"></i>',
    link: '<i class="fas fa-link"></i>'
  };

  linksContainer.innerHTML = links.map(link => `
    <div class="about-box">
      <a href="${link.url}" target="_blank" rel="noopener noreferrer"
         style="display: flex; align-items: center; gap: 12px; color: #f8f9f9; text-decoration: none; padding: 8px;">
        <span style="font-size: 24px;">${icones[link.type] || icones.link}</span>
        <span style="font-weight: 500;">${link.title || link.url}</span>
      </a>
    </div>
  `).join('');
}

addLinkBtn.addEventListener('click', async () => {
  if (!userLinksDocRef) return;

  const type = linkTypeInput.value;
  const title = linkTitleInput.value.trim();
  const url = linkUrlInput.value.trim();

  if (!url) return alert("Informe a URL do link!");

  try {
    await setDoc(userLinksDocRef, { links: arrayUnion({ type, title, url }) }, { merge: true });
    linkTitleInput.value = '';
    linkUrlInput.value = '';
  } catch (error) {
    console.error("Erro ao adicionar link:", error);
    alert("Erro ao adicionar link");
  }
});
</script>

</body>
</html>
